[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autolabel-lab"
version = "0.1.0"
description = "Video-to-OBB annotation experiments with X-AnyLabeling"
requires-python = ">=3.10"
dependencies = ["opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "PyYAML>=6,<7", "psutil>=5.9,<8"]

[project.optional-dependencies]
train = ["ultralytics==8.4.91"]
test = ["pytest>=8,<10"]

[project.scripts]
alab = "autolabel_lab.cli:main"
alab-web = "autolabel_lab.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autolabel_lab = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
